<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 100"
     role="img" aria-label="PrimeTurf" preserveAspectRatio="xMidYMid meet">
  <title>PrimeTurf</title>
  <!-- P -->
  <text x="0" y="88"
        font-family="Cinzel,'Cormorant Garamond',Georgia,'Times New Roman',serif"
        font-size="120" font-weight="600"
        fill="#1A3A2A">P</text>
  <!-- Left grass blade (shorter, leans left) -->
  <path d="M 79,90 C 76,70 73,48 76,24  Q 82,10  88,24  C 91,48  92,70  91,90 Z"
        fill="#B8922A"/>
  <!-- Centre grass blade (tallest, straight) -->
