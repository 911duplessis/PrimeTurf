        fill="#B8922A"/>
  <!-- Right grass blade (shorter, leans right) -->
  <path d="M 108,90 C 111,70 113,48 109,24 Q 115,10 121,24 C 123,48 121,70 118,90 Z"
        fill="#B8922A"/>
  <!-- T -->
  <text x="126" y="88"
        font-family="Cinzel,'Cormorant Garamond',Georgia,'Times New Roman',serif"
        font-size="120" font-weight="600"
        fill="#1A3A2A">T</text>
