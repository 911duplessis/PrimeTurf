"<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeTurf | Architects of Outdoor Perfection · Gauteng</title>
<meta name="description" content="PrimeTurf — Gauteng's architectural authority in luxury artificial grass design. Precision-engineered surfaces for distinguished estates across Pretoria, Sandton, Centurion and beyond.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
/* ════════════════════════════════════════════
   DESIGN TOKENS — LIGHT THEME
════════════════════════════════════════════ */
:root {
  --emerald:      #1B4332;
  --emerald-mid:  #204D30;
  --emerald-deep: #0F2B1E;
  --emerald-glow: #2d6a4f;
  --gold:         #B8922A;
  --gold-light:   #D4A940;
  --gold-pale:    #EDD9A3;
  --gold-dark:    #8A6A20;
  --gold-warm:    #C9A155;
  --charcoal:     #1A1A16;
  --charcoal-mid: #242420;
  --cream:        #F7F0DF;
  --cream-mid:    #F0E8CE;
  --cream-dark:   #E8DCBB;
  --parchment:    #FAF6ED;
  --parchment-mid:#F5EFE0;
  --white:        #FFFFFF;
  --text-dark:    #1E1C14;
  --text-mid:     #4A4438;
  --text-soft:    #7A7060;
  --border-gold:  rgba(184,146,42,.18);
  --border-gold-strong: rgba(184,146,42,.35);
}

/* ════════════════════════════════════════════
   RESET & BASE
════════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; font-size:16px; }
body {
  font-family:'Lato', sans-serif;
  background:var(--parchment);
  color:var(--text-dark);
  overflow-x:hidden;
}
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:var(--cream-dark); }
::-webkit-scrollbar-thumb { background:var(--gold); border-radius:3px; }
img { display:block; max-width:100%; }
a { text-decoration:none; }

/* ════════════════════════════════════════════
   TYPOGRAPHY SYSTEM
════════════════════════════════════════════ */
.t-display {
  font-family:'Cormorant Garamond', serif;
  font-weight:600; letter-spacing:-.5px; line-height:1.05;
}
.t-heading {
  font-family:'Playfair Display', serif;
  font-weight:700; line-height:1.1;
}
.t-label {
  font-family:'Lato', sans-serif;
  font-size:10px; font-weight:700;
  letter-spacing:4px; text-transform:uppercase;
}
.t-body {
  font-family:'Lato', sans-serif;
  font-size:15px; line-height:1.85; color:var(--text-mid);
}

/* ════════════════════════════════════════════
   LAYOUT HELPERS
════════════════════════════════════════════ */
.wrap { max-width:1140px; margin:0 auto; padding:0 28px; }
.wrap-narrow { max-width:820px; margin:0 auto; padding:0 28px; }
.section-pad { padding:108px 0; }
.section-pad-md { padding:72px 0; }
.section-pad-sm { padding:48px 0; }

/* ════════════════════════════════════════════
   GOLD ORNAMENTAL DIVIDER
════════════════════════════════════════════ */
.ornament {
  display:flex; align-items:center; gap:20px;
  margin:0 auto 40px; width:fit-content;
}
.ornament-line {
  width:60px; height:1px;
  background:linear-gradient(to right, transparent, var(--gold));
}
.ornament-line.rev {
  background:linear-gradient(to left, transparent, var(--gold));
}
.ornament svg { width:18px; height:18px; }
.section-intro { text-align:center; margin-bottom:72px; }
.section-intro .t-label { color:var(--gold); display:block; margin-bottom:16px; }
.section-intro h2 { font-size:clamp(36px,4vw,56px); margin-bottom:20px; }
.section-intro p { font-size:15px; line-height:1.9; color:var(--text-mid); max-width:540px; margin:0 auto; }

/* ════════════════════════════════════════════
   SCROLL REVEAL
════════════════════════════════════════════ */
.reveal { opacity:0; transform:translateY(28px); transition:opacity .7s ease, transform .7s ease; }
.reveal.in { opacity:1; transform:none; }
.reveal-d1 { transition-delay:.1s; }
.reveal-d2 { transition-delay:.2s; }
.reveal-d3 { transition-delay:.3s; }

/* ════════════════════════════════════════════
   BUTTONS
════════════════════════════════════════════ */
.btn {
  display:inline-flex; align-items:center; gap:10px;
  font-family:'Lato',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:2.5px; text-transform:uppercase;
  padding:15px 36px; border-radius:0;
  transition:all .3s ease; cursor:pointer; border:none;
}
.btn-gold-fill {
  background:var(--gold); color:var(--white);
  border:1.5px solid var(--gold);
}
.btn-gold-fill:hover {
  background:var(--gold-light); border-color:var(--gold-light);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(184,146,42,.3);
}
.btn-gold-outline {
  background:transparent; color:var(--gold);
  border:1.5px solid var(--border-gold-strong);
}
.btn-gold-outline:hover {
  background:rgba(184,146,42,.06); border-color:var(--gold);
}
.btn-emerald-fill {
  background:var(--emerald); color:var(--cream);
  border:1.5px solid var(--emerald);
}
.btn-emerald-fill:hover {
  background:var(--emerald-mid);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(27,67,50,.25);
}

/* ════════════════════════════════════════════
   NAVBAR — LIGHT BLENDED
════════════════════════════════════════════ */
.navbar {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  height:80px;
  background:rgba(250,246,237,.97);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-gold);
  display:flex; align-items:center;
  transition:box-shadow .3s, background .3s;
}
.navbar.scrolled {
  background:rgba(250,246,237,.99);
  box-shadow:0 4px 32px rgba(27,67,50,.08), 0 1px 0 var(--border-gold);
}
.navbar-inner {
  max-width:1140px; margin:0 auto; padding:0 28px;
  width:100%;
  display:flex; align-items:center; justify-content:space-between;
}

/* Logo lockup — image-based */
.logo-lockup {
  display:flex; align-items:center;
  text-decoration:none;
}
.logo-img-wrap {
  height:56px; width:auto;
  overflow:hidden;
  display:flex; align-items:flex-start;
  justify-content:center;
}
.logo-img-wrap img {
  height:auto;
  display:block;
}

.nav-links {
  display:flex; align-items:center; gap:36px; list-style:none;
}
.nav-links a {
  font-family:'Lato',sans-serif;
  font-size:10.5px; font-weight:700;
  letter-spacing:2.5px; text-transform:uppercase;
  color:var(--text-mid);
  position:relative; transition:color .3s;
}
.nav-links a::after {
  content:'';
  position:absolute; bottom:-4px; left:0;
  width:0; height:1px;
  background:var(--gold);
  transition:width .3s ease;
}
.nav-links a:hover { color:var(--gold); }
.nav-links a:hover::after { width:100%; }

.nav-right {
  display:flex; align-items:center; gap:16px;
}
.nav-phone {
  font-family:'Lato',sans-serif;
  font-size:11px; font-weight:700; letter-spacing:1px;
  color:var(--text-soft); transition:color .3s;
}
.nav-phone:hover { color:var(--gold); }

.hamburger {
  display:none; flex-direction:column; gap:5px;
  cursor:pointer; padding:4px;
}
.hamburger span {
  display:block; width:22px; height:1.5px;
  background:var(--emerald); border-radius:2px; transition:all .3s;
}

/* mobile nav */
.mobile-nav {
  display:none; position:fixed;
  top:80px; left:0; right:0; z-index:999;
  background:var(--parchment);
  border-top:1px solid var(--border-gold);
  padding:28px; flex-direction:column; gap:0;
  box-shadow:0 8px 32px rgba(0,0,0,.08);
}
.mobile-nav.open { display:flex; }
.mobile-nav a {
  font-family:'Lato',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:2.5px; text-transform:uppercase;
  color:var(--text-mid);
  padding:14px 0;
  border-bottom:1px solid var(--border-gold);
  transition:color .3s;
}
.mobile-nav a:hover { color:var(--gold); }

/* ════════════════════════════════════════════
   HERO — LIGHT CREAM ARCHITECTURAL
════════════════════════════════════════════ */
#home {
  min-height:100vh;
  background:
    radial-gradient(ellipse at 60% 40%, rgba(184,146,42,.07) 0%, transparent 55%),
    radial-gradient(ellipse at 20% 80%, rgba(27,67,50,.05) 0%, transparent 50%),
    linear-gradient(170deg, var(--white) 0%, var(--parchment) 30%, var(--cream-mid) 70%, var(--cream-dark) 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center;
  padding:120px 28px 80px;
  position:relative; overflow:hidden;
}

/* Subtle grain texture */
#home::before {
  content:'';
  position:absolute; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  opacity:.6; pointer-events:none;
}

/* Gold bottom rule */
#home::after {
  content:'';
  position:absolute; bottom:0; left:0; right:0; height:1px;
  background:linear-gradient(to right, transparent 0%, var(--border-gold-strong) 30%, rgba(184,146,42,.5) 50%, var(--border-gold-strong) 70%, transparent 100%);
}

/* Decorative concentric arcs */
.hero-ring {
  position:absolute; border-radius:50%;
  border:1px solid rgba(184,146,42,.05);
  pointer-events:none;
  transform:translate(-50%,-50%);
  top:50%; left:50%;
}

/* Large watermark PT behind content */
.hero-watermark {
  position:absolute;
  top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(240px, 28vw, 380px);
  font-weight:700; letter-spacing:-20px;
  color:rgba(27,67,50,.035);
  pointer-events:none;
  user-select:none;
  line-height:1;
  white-space:nowrap;
}

.hero-content { position:relative; z-index:2; max-width:900px; }

/* Logo mark in hero */
.hero-logo-wrap {
  display:flex; justify-content:center;
  margin-bottom:32px;
}
.hero-logo-img {
  width:200px; height:130px;
  overflow:hidden;
  display:flex; align-items:flex-start; justify-content:center;
}
.hero-logo-img img {
  width:200px; height:auto;
  display:block;
  margin-top:-44%;
}

/* Eyebrow */
.hero-eyebrow {
  display:inline-flex; align-items:center; gap:14px; margin-bottom:24px;
}
.hero-eyebrow-line {
  width:40px; height:1px;
  background:linear-gradient(to right, transparent, var(--gold));
}
.hero-eyebrow-line.rev {
  background:linear-gradient(to left, transparent, var(--gold));
}
.hero-eyebrow span {
  font-family:'Lato', sans-serif;
  font-size:10px; font-weight:700; letter-spacing:4px;
  text-transform:uppercase; color:var(--gold);
}

/* Main headline */
.hero-sup {
  font-family:'Lato',sans-serif;
  font-size:10px; font-weight:700; letter-spacing:6px;
  text-transform:uppercase; color:var(--gold);
  display:block; margin-bottom:16px;
}
.hero-title {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(48px,7.5vw,88px);
  font-weight:600;
  color:var(--emerald);
  line-height:1.0; letter-spacing:-.5px;
  margin-bottom:8px;
}
.hero-title-italic { font-style:italic; color:var(--gold); }
.hero-subtitle {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(16px,2.2vw,22px);
  font-weight:300; font-style:italic;
  color:var(--text-soft);
  letter-spacing:5px; text-transform:uppercase;
  margin-bottom:16px;
}
.hero-subtext {
  font-family:'Lato',sans-serif;
  font-size:13px; font-weight:400;
  color:var(--text-mid); letter-spacing:.5px;
  margin-bottom:48px;
  max-width:520px; margin-left:auto; margin-right:auto;
  line-height:1.8;
}

.hero-ctas {
  display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
  margin-bottom:72px;
}

/* Proof points — light version */
.hero-proof {
  display:flex; gap:40px; justify-content:center; flex-wrap:wrap;
}
.proof-item { text-align:center; }
.proof-line {
  width:1px; height:40px; background:var(--border-gold-strong);
  align-self:center;
}
.proof-text {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(12px,1.4vw,15px); font-weight:500; font-style:italic;
  color:var(--text-soft); letter-spacing:.5px;
  max-width:180px;
}

/* Scroll indicator */
.hero-scroll-hint {
  position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:10px;
  text-decoration:none;
}
.hero-scroll-hint span {
  font-size:9px; letter-spacing:4px; text-transform:uppercase;
  color:var(--text-soft);
}
.scroll-pulse {
  width:1px; height:48px;
  background:linear-gradient(to bottom, rgba(184,146,42,.6), transparent);
  animation:scrollLine 2.5s ease infinite;
}
@keyframes scrollLine {
  0%   { transform:scaleY(0); transform-origin:top; opacity:1; }
  45%  { transform:scaleY(1); transform-origin:top; opacity:1; }
  46%  { transform:scaleY(1); transform-origin:bottom; opacity:1; }
  100% { transform:scaleY(0); transform-origin:bottom; opacity:0; }
}

/* ════════════════════════════════════════════
   POSITIONING BAND — LIGHT
════════════════════════════════════════════ */
.position-band {
  background:var(--white);
  border-bottom:1px solid var(--border-gold);
  border-top:1px solid var(--border-gold);
}
.position-band-inner {
  max-width:1140px; margin:0 auto; padding:0 28px;
  display:grid; grid-template-columns:repeat(4,1fr);
}
.pos-item {
  padding:36px 24px;
  border-right:1px solid var(--border-gold);
  display:flex; flex-direction:column; gap:10px;
  transition:background .3s;
}
.pos-item:last-child { border-right:none; }
.pos-item:hover { background:rgba(184,146,42,.04); }
.pos-icon { width:32px; height:32px; color:var(--gold); font-size:20px; }
.pos-text {
  font-family:'Cormorant Garamond', serif;
  font-size:15px; font-weight:500; font-style:italic;
  color:var(--text-mid); line-height:1.5;
}

/* ════════════════════════════════════════════
   BRAND STATEMENT — LIGHT
════════════════════════════════════════════ */
.brand-statement {
  background:var(--parchment-mid);
  padding:96px 0;
  position:relative; overflow:hidden;
  border-bottom:1px solid var(--border-gold);
}
.brand-statement::before {
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(ellipse at 80% 50%, rgba(184,146,42,.05) 0%, transparent 60%);
}
.brand-statement-inner {
  max-width:1140px; margin:0 auto; padding:0 28px;
  display:grid; grid-template-columns:1fr 1fr;
  gap:80px; align-items:center;
  position:relative; z-index:1;
}
.bs-left .t-label { color:var(--gold); display:block; margin-bottom:20px; }
.bs-headline {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(36px,4vw,54px);
  font-weight:600; line-height:1.1;
  color:var(--emerald);
}
.bs-headline em { color:var(--gold); font-style:italic; }
.bs-gold-rule { width:48px; height:1px; background:var(--gold); margin:28px 0; opacity:.5; }
.bs-body { font-size:15px; line-height:1.9; color:var(--text-mid); }
.bs-body p+p { margin-top:16px; }
.bs-credentials { display:flex; flex-direction:column; gap:16px; }
.credential-item {
  display:flex; align-items:flex-start; gap:16px;
  padding:20px;
  border:1px solid var(--border-gold);
  border-radius:2px;
  background:rgba(255,255,255,.6);
  transition:border-color .3s, background .3s;
}
.credential-item:hover {
  border-color:var(--border-gold-strong);
  background:rgba(255,255,255,.9);
}
.credential-num {
  font-family:'Cormorant Garamond', serif;
  font-size:28px; font-weight:600; font-style:italic;
  color:var(--gold); opacity:.5; line-height:1; flex-shrink:0; min-width:28px;
}
.credential-text { font-size:13px; line-height:1.8; color:var(--text-mid); }
.credential-text strong {
  display:block;
  font-family:'Playfair Display', serif;
  font-size:15px; font-weight:600;
  color:var(--emerald); margin-bottom:4px;
}

/* ════════════════════════════════════════════
   SERVICES — inherit light
════════════════════════════════════════════ */
#services { background:var(--parchment); }
.services-layout {
  display:grid; grid-template-columns:repeat(3,1fr);
  border:1px solid var(--border-gold);
}
.service-panel {
  padding:56px 40px;
  border-right:1px solid var(--border-gold);
  position:relative; overflow:hidden;
  transition:background .4s;
}
.service-panel:last-child { border-right:none; }
.service-panel:hover { background:var(--cream-mid); }
.service-panel::before {
  content:'';
  position:absolute; top:0; left:0;
  width:100%; height:3px;
  background:linear-gradient(to right, var(--gold-dark), var(--gold-light));
  transform:scaleX(0); transform-origin:left;
  transition:transform .4s ease;
}
.service-panel:hover::before { transform:scaleX(1); }
.svc-number {
  font-family:'Cormorant Garamond', serif;
  font-size:56px; font-weight:600; font-style:italic;
  color:rgba(27,67,50,.07); line-height:1; margin-bottom:8px; user-select:none;
}
.svc-icon { font-size:28px; margin-bottom:20px; }
.svc-title {
  font-family:'Playfair Display', serif;
  font-size:22px; font-weight:700;
  color:var(--emerald); margin-bottom:12px;
}
.svc-desc { font-size:14px; line-height:1.85; color:var(--text-mid); margin-bottom:28px; }
.svc-list { list-style:none; display:flex; flex-direction:column; gap:9px; }
.svc-list li {
  font-size:13px; color:var(--text-mid);
  display:flex; align-items:center; gap:10px;
}
.svc-list li::before {
  content:''; width:4px; height:4px;
  background:var(--gold); border-radius:50%; flex-shrink:0;
}
.svc-link {
  display:inline-flex; align-items:center; gap:8px;
  margin-top:32px; font-size:11px; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; color:var(--gold); transition:gap .3s;
}
.svc-link:hover { gap:14px; }

/* ════════════════════════════════════════════
   ESTATES MARQUEE
════════════════════════════════════════════ */
.estates-band {
  background:var(--white);
  padding:28px 0;
  border-top:1px solid var(--border-gold);
  border-bottom:1px solid var(--border-gold);
  overflow:hidden;
}
.estates-track {
  display:flex; gap:48px; white-space:nowrap;
  animation:marquee 28s linear infinite;
}
.estates-track:hover { animation-play-state:paused; }
@keyframes marquee {
  0%   { transform:translateX(0); }
  100% { transform:translateX(-50%); }
}
.estate-name {
  font-family:'Cormorant Garamond', serif;
  font-size:13px; font-weight:500; font-style:italic;
  color:var(--text-mid); letter-spacing:1px;
  display:inline-flex; align-items:center; gap:24px;
}
.estate-dot {
  width:3px; height:3px; background:var(--gold);
  border-radius:50%; display:inline-block; opacity:.5;
}

/* ════════════════════════════════════════════
   BEFORE / AFTER
════════════════════════════════════════════ */
#gallery { background:var(--parchment-mid); padding:108px 0; }
.ba-container {
  position:relative; max-width:900px; margin:0 auto 64px;
  aspect-ratio:16/9; overflow:hidden; cursor:ew-resize;
  user-select:none;
  border:1px solid var(--border-gold);
}
.ba-panel { position:absolute; top:0; height:100%; }
.ba-before {
  left:0; width:100%;
  background:linear-gradient(140deg, #8a7a5a 0%, #6b5c3a 30%, #4a3d22 60%, #2a2010 100%);
  display:flex; align-items:center; justify-content:center;
}
.ba-after {
  left:0; width:100%;
  background:linear-gradient(140deg, #4a9a5a 0%, #2d6a4f 35%, #1B4332 65%, #0F2B1E 100%);
  clip-path:inset(0 50% 0 0);
}
.ba-before::after, .ba-after::after {
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0px, rgba(0,0,0,.03) 1px, transparent 1px, transparent 22px);
}
.ba-before-text, .ba-after-text {
  position:absolute; z-index:5;
  font-family:'Cormorant Garamond',serif;
  font-style:italic; font-size:clamp(16px,2.5vw,24px);
  pointer-events:none;
}
.ba-before-text { left:32px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,.4); }
.ba-after-text   { right:32px; top:50%; transform:translateY(-50%); color:rgba(212,169,64,.8); }
.ba-label-tag {
  position:absolute; bottom:20px; z-index:6;
  font-size:9px; font-weight:700; letter-spacing:3px;
  text-transform:uppercase; color:var(--white);
  background:rgba(0,0,0,.45); padding:5px 14px;
}
.ba-label-tag.left  { left:20px; }
.ba-label-tag.right { right:20px; }
.ba-slider-line {
  position:absolute; top:0; bottom:0; z-index:10;
  left:50%; transform:translateX(-50%);
  width:2px; background:var(--gold);
}
.ba-handle {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:52px; height:52px;
  background:var(--gold); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; color:var(--white); font-weight:900;
  box-shadow:0 4px 20px rgba(0,0,0,.25); letter-spacing:-2px;
}
.gallery-mosaic {
  display:grid; grid-template-columns:repeat(3,1fr);
  grid-template-rows:auto auto; gap:3px;
}
.gmosaic-item {
  overflow:hidden; position:relative;
  background:var(--emerald-deep); cursor:pointer;
}
.gmosaic-item.span2 { grid-column:span 2; }
.gmosaic-item { aspect-ratio:4/3; }
.gmosaic-item.span2 { aspect-ratio:16/8; }
.gmosaic-fill {
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:10px;
  transition:transform .6s ease;
  font-family:'Cormorant Garamond',serif;
  font-style:italic; text-align:center; padding:20px;
}
.gmosaic-item:hover .gmosaic-fill { transform:scale(1.04); }
.gmosaic-label { font-size:14px; color:rgba(201,161,85,.5); }
.gmosaic-sub { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(201,161,85,.25); }
.gmosaic-overlay {
  position:absolute; inset:0;
  background:rgba(15,43,30,0);
  display:flex; align-items:center; justify-content:center;
  transition:background .3s;
}
.gmosaic-item:hover .gmosaic-overlay { background:rgba(15,43,30,.55); }
.gmosaic-plus { color:var(--gold); font-size:28px; opacity:0; transform:scale(.7); transition:all .3s; }
.gmosaic-item:hover .gmosaic-plus { opacity:1; transform:scale(1); }
.gmosaic-item:nth-child(1) { background:linear-gradient(140deg,#1a4a28,#204D30); }
.gmosaic-item:nth-child(2) { background:linear-gradient(140deg,#153320,#1e4a2a); }
.gmosaic-item:nth-child(3) { background:linear-gradient(140deg,#204D30,#2d6a4f); }
.gmosaic-item:nth-child(4) { background:linear-gradient(140deg,#1a3d24,#204D30); }
.gmosaic-item:nth-child(5) { background:linear-gradient(140deg,#2a5035,#1e4a2a); }

/* ════════════════════════════════════════════
   PROCESS
════════════════════════════════════════════ */
.process-section { background:var(--parchment); padding:108px 0; }
.process-steps {
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:0; position:relative;
}
.process-steps::before {
  content:''; position:absolute; top:28px; left:12%;
  width:76%; height:1px;
  background:linear-gradient(to right, transparent, var(--border-gold-strong) 20%, var(--border-gold-strong) 80%, transparent);
  pointer-events:none;
}
.step { padding:0 24px; text-align:center; display:flex; flex-direction:column; align-items:center; }
.step-circle {
  width:56px; height:56px; border-radius:50%;
  border:1px solid var(--border-gold-strong);
  background:var(--white);
  display:flex; align-items:center; justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:22px; font-weight:600; font-style:italic;
  color:var(--gold); margin-bottom:24px;
  position:relative; z-index:1; transition:all .3s;
}
.step:hover .step-circle {
  background:var(--gold); color:var(--white);
  border-color:var(--gold);
  box-shadow:0 4px 20px rgba(184,146,42,.3);
}
.step-title { font-family:'Playfair Display',serif; font-size:17px; font-weight:700; color:var(--emerald); margin-bottom:10px; }
.step-desc { font-size:13px; line-height:1.8; color:var(--text-mid); }

/* ════════════════════════════════════════════
   GAUTENG REGION BAND
════════════════════════════════════════════ */
.gauteng-band {
  background:var(--white);
  border-top:1px solid var(--border-gold);
  border-bottom:1px solid var(--border-gold);
  padding:96px 0;
  position:relative; overflow:hidden;
}
.gauteng-inner {
  max-width:1140px; margin:0 auto; padding:0 28px;
  display:grid; grid-template-columns:1fr 1fr;
  gap:80px; align-items:center;
}
.gauteng-copy .t-label { color:var(--gold); display:block; margin-bottom:20px; }
.gauteng-headline {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(34px,4vw,52px);
  font-weight:600; line-height:1.1;
  color:var(--emerald); margin-bottom:24px;
}
.gauteng-headline em { color:var(--gold); font-style:italic; }
.gauteng-body { font-size:15px; line-height:1.9; color:var(--text-mid); margin-bottom:32px; }
/* Estate markers */
.estate-markers {
  display:flex; flex-wrap:wrap; gap:12px; margin-top:28px;
}
.estate-pill {
  font-family:'Cormorant Garamond',serif;
  font-size:13px; font-style:italic;
  color:var(--emerald);
  padding:7px 18px;
  border:1px solid var(--border-gold-strong);
  border-radius:2px;
  background:rgba(184,146,42,.04);
  transition:all .3s;
}
.estate-pill:hover {
  background:var(--gold); color:var(--white);
  border-color:var(--gold);
}
/* Stylized Gauteng map outline */
.gauteng-map {
  position:relative;
  display:flex; align-items:center; justify-content:center;
  min-height:320px;
}
.map-glow {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at center, rgba(184,146,42,.08) 0%, transparent 70%);
}
.map-outline {
  width:100%; max-width:420px;
  opacity:.5;
}
.map-dot {
  position:absolute;
  width:8px; height:8px; border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 12px rgba(184,146,42,.5);
}
.map-dot-label {
  position:absolute;
  font-family:'Cormorant Garamond',serif;
  font-size:11px; font-style:italic;
  color:var(--gold-dark);
  white-space:nowrap;
}

/* ════════════════════════════════════════════
   TESTIMONIALS — LIGHT
════════════════════════════════════════════ */
#testimonials {
  background:var(--parchment-mid);
  padding:108px 0;
  border-top:1px solid var(--border-gold);
}
.testi-grid {
  display:grid; grid-template-columns:repeat(2,1fr); gap:24px;
}
.testi-card {
  padding:48px 44px;
  border:1px solid var(--border-gold);
  background:var(--white);
  position:relative; overflow:hidden;
  transition:border-color .3s, box-shadow .3s;
}
.testi-card:hover {
  border-color:var(--border-gold-strong);
  box-shadow:0 8px 32px rgba(184,146,42,.1);
}
.testi-mark {
  font-family:'Cormorant Garamond',serif;
  font-size:100px; line-height:.5;
  color:var(--gold); opacity:.1;
  position:absolute; top:28px; left:36px;
  user-select:none; pointer-events:none;
}
.testi-stars { color:var(--gold); font-size:12px; letter-spacing:3px; margin-bottom:20px; display:block; }
.testi-text {
  font-family:'Cormorant Garamond',serif;
  font-size:18px; line-height:1.75; font-style:italic;
  color:var(--text-mid); margin-bottom:32px; position:relative; z-index:1;
}
.testi-author {
  display:flex; align-items:center; gap:14px;
  border-top:1px solid var(--border-gold); padding-top:24px;
}
.testi-avatar {
  width:44px; height:44px; border-radius:50%;
  border:1px solid var(--border-gold-strong);
  background:rgba(184,146,42,.08);
  display:flex; align-items:center; justify-content:center;
  font-family:'Playfair Display',serif;
  font-weight:700; font-size:16px; color:var(--gold); flex-shrink:0;
}
.testi-name { font-weight:700; font-size:14px; color:var(--emerald); margin-bottom:2px; }
.testi-location { font-size:11px; color:var(--text-soft); letter-spacing:1px; }

/* ════════════════════════════════════════════
   CTA BAND — DARK GREEN (contrast moment)
════════════════════════════════════════════ */
.cta-band {
  background:linear-gradient(170deg, var(--emerald-deep) 0%, var(--emerald-mid) 60%, var(--emerald) 100%);
  padding:108px 0; text-align:center;
  position:relative; overflow:hidden;
}
.cta-band::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 50%, rgba(184,146,42,.08) 0%, transparent 60%);
}
.cta-tagline {
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(38px,5vw,68px);
  font-weight:600; color:var(--cream);
  line-height:1.05; margin-bottom:14px;
  position:relative; z-index:1;
}
.cta-tagline em { color:var(--gold-light); font-style:italic; }
.cta-sub {
  font-size:11px; letter-spacing:5px; text-transform:uppercase;
  color:rgba(245,237,216,.45); margin-bottom:48px;
  position:relative; z-index:1;
}
.cta-btns { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; position:relative; z-index:1; }

/* ════════════════════════════════════════════
   CONTACT
════════════════════════════════════════════ */
#contact { background:var(--parchment); padding:108px 0; }
.contact-layout {
  display:grid; grid-template-columns:1fr 1.4fr; gap:80px; align-items:start;
}
.contact-info .t-label { color:var(--gold); display:block; margin-bottom:20px; }
.contact-info h2 {
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(32px,3.5vw,48px); font-weight:600; color:var(--emerald);
  line-height:1.1; margin-bottom:20px;
}
.contact-info p { font-size:15px; line-height:1.9; color:var(--text-mid); margin-bottom:32px; }
.contact-detail {
  display:flex; align-items:center; gap:14px;
  padding:16px 0; border-bottom:1px solid var(--border-gold);
}
.contact-detail:last-of-type { border-bottom:none; }
.cd-icon { font-size:18px; color:var(--gold); width:24px; text-align:center; }
.cd-link { font-size:14px; font-weight:700; color:var(--emerald); letter-spacing:.5px; transition:color .3s; }
.cd-link:hover { color:var(--gold); }
.contact-wa-btn {
  display:inline-flex; align-items:center; gap:12px;
  margin-top:28px; padding:16px 32px;
  background:var(--emerald); color:var(--cream);
  font-family:'Lato',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:2.5px; text-transform:uppercase;
  transition:all .3s;
}
.contact-wa-btn:hover { background:var(--emerald-mid); transform:translateY(-2px); }
.contact-form-wrap {
  background:var(--white);
  border:1px solid var(--border-gold);
  padding:48px;
}
.form-head {
  font-family:'Playfair Display',serif;
  font-size:22px; font-weight:700; color:var(--emerald);
  margin-bottom:8px;
}
.form-sub { font-size:13px; color:var(--text-mid); margin-bottom:32px; line-height:1.7; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-group { margin-bottom:16px; }
.form-group label {
  display:block; font-size:10px; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; color:var(--text-mid); margin-bottom:8px;
}
.form-group input, .form-group select, .form-group textarea {
  width:100%; padding:13px 16px;
  background:var(--parchment); border:1px solid var(--border-gold);
  font-family:'Lato',sans-serif; font-size:14px; color:var(--text-dark);
  outline:none; transition:border-color .3s, background .3s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color:var(--gold); background:var(--white);
}
.form-group textarea { height:120px; resize:vertical; }
.form-submit-btn {
  width:100%; padding:16px;
  background:var(--gold); color:var(--white);
  font-family:'Lato',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:2.5px; text-transform:uppercase;
  border:none; cursor:pointer; transition:all .3s; margin-top:8px;
}
.form-submit-btn:hover { background:var(--gold-light); }
.form-wa-note { font-size:12px; color:var(--text-soft); text-align:center; margin-top:16px; }
.form-wa-note a { color:var(--gold); }

/* ════════════════════════════════════════════
   FOOTER — DEEP GREEN / GOLD
════════════════════════════════════════════ */
footer {
  background:
    linear-gradient(175deg, var(--emerald-deep) 0%, #0a1f12 60%, #050e08 100%);
  padding:72px 0 0;
  border-top:1px solid rgba(184,146,42,.2);
}
.footer-grid {
  display:grid; grid-template-columns:2fr 1fr 1fr 1fr;
  gap:48px; margin-bottom:56px;
}
.footer-brand { display:flex; flex-direction:column; gap:16px; text-decoration:none; }
.footer-logo-wrap {
  width:160px; height:105px; overflow:hidden;
  display:flex; align-items:flex-start; justify-content:center;
}
.footer-logo-wrap img {
  width:160px; height:auto; display:block;
  /* Show top logo (dark green variant) */
}
.footer-about {
  font-size:13px; line-height:1.9;
  color:rgba(245,237,216,.45); max-width:280px;
}
.footer-socials { display:flex; gap:12px; margin-top:8px; }
.footer-soc {
  width:36px; height:36px;
  border:1px solid rgba(184,146,42,.25);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; transition:all .3s;
}
.footer-soc:hover { border-color:var(--gold); background:rgba(184,146,42,.1); }
.footer-col-title {
  font-family:'Lato',sans-serif;
  font-size:9px; font-weight:700; letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(184,146,42,.6); display:block; margin-bottom:20px;
}
.footer-nav-list { list-style:none; display:flex; flex-direction:column; gap:10px; }
.footer-nav-list a {
  font-size:13px; color:rgba(245,237,216,.4);
  transition:color .3s;
}
.footer-nav-list a:hover { color:var(--gold); }
.footer-tagline-band {
  border-top:1px solid rgba(184,146,42,.1);
  padding:28px 0;
  text-align:center;
}
.footer-tagline-text {
  font-family:'Cormorant Garamond',serif;
  font-size:14px; font-style:italic;
  color:rgba(184,146,42,.5); letter-spacing:2px;
}
.footer-bottom {
  border-top:1px solid rgba(184,146,42,.08);
  padding:24px 0;
  display:flex; justify-content:space-between; align-items:center;
  flex-wrap:wrap; gap:12px;
}
.footer-copy { font-size:11px; color:rgba(245,237,216,.2); letter-spacing:.5px; }
.footer-legal { display:flex; gap:24px; }
.footer-legal a { font-size:11px; color:rgba(245,237,216,.2); transition:color .3s; }
.footer-legal a:hover { color:var(--gold); }

/* ════════════════════════════════════════════
   FLOATING WA BUTTON
════════════════════════════════════════════ */
.wa-float {
  position:fixed; bottom:28px; right:28px; z-index:900;
  display:flex; flex-direction:column; align-items:flex-end; gap:10px;
}
.wa-tooltip {
  background:var(--charcoal); color:var(--cream);
  font-size:11px; font-weight:700; letter-spacing:1px;
  padding:8px 16px; border-radius:2px;
  opacity:0; transform:translateX(8px);
  transition:all .3s; white-space:nowrap;
  pointer-events:none;
  border:1px solid rgba(184,146,42,.25);
}
.wa-float:hover .wa-tooltip { opacity:1; transform:translateX(0); }
.wa-circle {
  width:52px; height:52px; border-radius:50%;
  background:#25D366;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 20px rgba(37,211,102,.35), 0 0 0 2px rgba(184,146,42,.3);
  transition:transform .3s, box-shadow .3s;
}
.wa-circle:hover {
  transform:scale(1.1);
  box-shadow:0 8px 28px rgba(37,211,102,.45), 0 0 0 3px var(--gold);
}
.wa-circle svg { width:26px; height:26px; fill:white; }

/* Back to top */
.btt {
  position:fixed; bottom:92px; right:28px; z-index:900;
  width:40px; height:40px;
  background:var(--white); color:var(--gold);
  font-size:16px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--border-gold-strong);
  opacity:0; pointer-events:none; transition:all .3s;
  text-decoration:none;
}
.btt.show { opacity:1; pointer-events:all; }
.btt:hover { background:var(--gold); color:var(--white); }

/* ════════════════════════════════════════════
   RESPONSIVE
════════════════════════════════════════════ */
@media (max-width:768px) {
  .nav-links, .nav-right .btn { display:none; }
  .hamburger { display:flex; }
  .hero-title { font-size:clamp(40px,10vw,72px); }
  .brand-statement-inner, .gauteng-inner, .contact-layout { grid-template-columns:1fr; gap:48px; }
  .services-layout { grid-template-columns:1fr; }
  .testi-grid { grid-template-columns:1fr; }
  .footer-grid { grid-template-columns:1fr 1fr; }
  .position-band-inner { grid-template-columns:repeat(2,1fr); }
  .process-steps { grid-template-columns:repeat(2,1fr); }
  .process-steps::before { display:none; }
  .hero-proof { gap:24px; }
  .proof-line { display:none; }
}
@media (max-width:480px) {
  .footer-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- ═══════════════ NAVBAR ═══════════════ -->
<nav class="navbar" id="mainNav">
  <div class="navbar-inner">
